version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orderly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - orderly-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./services/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderly-network
    volumes:
      - ./services/auth-service/src:/app/src
      - auth_nm:/app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"

  order-service:
    build:
      context: ./services/order-service
    ports:
      - "3002:3002"
    env_file:
      - ./services/order-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderly-network
    volumes:
      - ./services/order-service/src:/app/src
      - order_nm:/app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"

  payment-service:
    build:
      context: ./services/payment-service
    ports:
      - "3003:3003"
    env_file:
      - ./services/payment-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orderly-network
    volumes:
      - ./services/payment-service/src:/app/src
      - payment_nm:/app/node_modules
    command: npm run dev

  notify-service:
    build:
      context: ./services/notify-service
    ports:
      - "3005:3005"
    env_file:
      - ./services/notify-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - orderly-network
    volumes:
      - ./services/notify-service/src:/app/src
      - notify_nm:/app/node_modules
    command: npm run dev

  stock-service:
    build:
      context: ./services/stock-service
    ports:
      - "3004:3004"
    env_file:
      - ./services/stock-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderly-network
    volumes:
      - ./services/stock-service/src:/app/src
    command: sh -c "npx prisma migrate deploy && npm run dev"

  catalog-service:
    build:
      context: ./services/catalog-service
    ports:
      - "3006:3006"
    env_file:
      - ./services/catalog-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - orderly-network
    volumes:
      - ./services/catalog-service/src:/app/src
      - catalog_nm:/app/node_modules
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"

networks:
  orderly-network:
    driver: bridge

volumes:
  postgres_data:
  auth_nm:
  order_nm:
  payment_nm:
  notify_nm:
  catalog_nm:
